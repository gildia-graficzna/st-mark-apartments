<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St. Mark Apartments</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --green: #2E3A2F;
  --light: #F5F4F1;
  --pink: #E6A5B5;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: var(--light);
}

/* NAV TOP */
.topbar {
  position: absolute;
  top: 0;
  width: 100%;
  padding: 10px 40px;
  font-size: 13px;
  color: rgba(255,255,255,0.8);
  display: flex;
  justify-content: space-between;
  z-index: 3;
}

/* NAV */
.nav {
  position: absolute;
  top: 40px;
  width: 100%;
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 3;
}

.logo {
  color: white;
  font-weight: 500;
  letter-spacing: 1px;
}

.nav-links {
  display: flex;
  gap: 30px;
  color: white;
  font-size: 14px;
}

.nav-links a {
  text-decoration: none;
  color: white;
  opacity: 0.8;
}

.btn-outline {
  border: 1px solid rgba(255,255,255,0.6);
  padding: 10px 20px;
  border-radius: 999px;
  color: white;
  font-size: 13px;
}

/* HERO */
.hero {
  height: 100vh;
  position: relative;
  background: url('https://images.unsplash.com/photo-1505693416388-ac5ce068fe85') center/cover;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
}

/* overlay */
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    rgba(0,0,0,0.5),
    rgba(0,0,0,0.4)
  );
}

/* content */
.hero-content {
  position: relative;
  z-index: 2;
  max-width: 900px;
}

.hero-sub {
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.7;
  margin-bottom: 20px;
}

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 5rem;
  font-weight: 400;
  line-height: 1.1;
  margin: 0 0 20px;
}

.hero p {
  font-size: 16px;
  opacity: 0.85;
  margin-bottom: 40px;
}

.cta {
  background: var(--pink);
  color: black;
  padding: 16px 36px;
  border-radius: 999px;
  text-decoration: none;
  font-size: 13px;
  letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="topbar">
  <div>(12) 345 67 89</div>
  <div>kontakt@stmark29.pl</div>
</div>

<div class="nav">
  <div class="logo">ST.MARK</div>
  <div class="nav-links">
    <a href="#">O nas</a>
    <a href="#">Galeria</a>
    <a href="#">Lokalizacja</a>
    <a href="#">Kontakt</a>
  </div>
  <div class="btn-outline">Rezerwuj</div>
</div>

<section class="hero">
  <div class="hero-content">
    <div class="hero-sub">BUTIKOWE APARTAMENTY W KRAKOWIE</div>
    <h1>W samym sercu<br>Krakowa</h1>
    <p>
      Zatrzymaj się w centrum Starego Miasta — kawiarnie, uliczki
      i historia są dosłownie za rogiem.
    </p>
    <a href="#" class="cta">SPRAWDŹ DOSTĘPNOŚĆ</a>
  </div>
</section>

</body>
</html>
